<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta http-equiv="Permissions-Policy" content="geolocation=(self)">
<title>Markhor Locator — Pakistan Cell ID / BTS Finder</title>
<link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css">
<style>
:root{
  --bg:#07101d;--card:#111d2e;--field:#07111f;--line:#29415f;--text:#e8eef8;
  --muted:#9aabc2;--green:#12a56f;--blue:#1769e0;--red:#bd3450;--gold:#a76b00;
  --accent:#00c9a7;--markhor:#c9a227;
}
*{box-sizing:border-box}
body{margin:0;background:linear-gradient(180deg,#070e19,#0a1422);color:var(--text);font:16px/1.45 system-ui,-apple-system,Segoe UI,Roboto,Arial,sans-serif}
main{max-width:960px;margin:auto;padding:16px}
.hero{padding:10px 4px 20px;text-align:center}
.hero h1{font-size:28px;margin:6px 0;color:var(--markhor);letter-spacing:.5px}
.hero p{color:var(--muted);margin:6px 0 10px}
.pill{display:inline-block;padding:5px 10px;border-radius:99px;background:#183454;color:#b9d8ff;margin:3px;font-size:12px}
.card{background:var(--card);border:1px solid var(--line);border-radius:18px;padding:16px;margin:14px 0;box-shadow:0 8px 28px #0004}
.card h2{font-size:19px;margin:0 0 14px;display:flex;align-items:center;gap:8px}
.grid{display:grid;grid-template-columns:1fr 1fr;gap:10px}
@media(max-width:640px){.grid{grid-template-columns:1fr}}
label{display:block;color:var(--muted);font-size:13px;margin:8px 0 5px}
input,select,button,textarea{width:100%;min-height:46px;border-radius:12px;border:1px solid #304664;background:var(--field);color:var(--text);padding:10px 12px;font-size:15px}
button{font-weight:700;cursor:pointer;background:#183454;transition:.15s}
button:hover{filter:brightness(1.12)}
button.primary{background:var(--green)}button.blue{background:var(--blue)}button.red{background:var(--red)}button.gold{background:var(--gold)}
.row{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:10px}
@media(max-width:640px){.row{grid-template-columns:1fr}}
.status{padding:12px;border-radius:12px;background:#071321;color:#c9d5e5;margin-top:10px;line-height:1.4}
.ok{color:#59e0ad}.err{color:#ff879e}.warn{color:#ffd166}.small{font-size:13px;color:var(--muted)}
.stats{display:grid;grid-template-columns:repeat(2,1fr);gap:10px}
.stat{background:#071321;border-radius:13px;padding:12px;text-align:center}
.stat b{display:block;font-size:18px;margin-top:5px;word-break:break-all}
#map{height:520px;border-radius:14px;overflow:hidden;margin-top:10px}
#mapShell{position:relative}
#mapShell.map-expanded{position:fixed;inset:0;z-index:9999;background:#07101d;padding:0}
#mapShell.map-expanded #map{height:100%;margin:0;border-radius:0}
#mapExit{display:none;position:absolute;top:14px;right:14px;z-index:1001;width:auto;background:var(--red)}
#mapShell.map-expanded #mapExit{display:block}
.overlay{position:absolute;left:12px;top:12px;z-index:1000;max-width:min(88vw,420px);padding:10px 12px;border:1px solid #49627f;border-radius:12px;background:#071321ee;box-shadow:0 4px 16px #0008;font-size:12px;pointer-events:none}
.compass{width:190px;height:190px;border:2px solid #49627f;border-radius:50%;margin:15px auto;position:relative;background:#0a1625}
.needle{position:absolute;left:50%;top:20px;width:4px;height:70px;background:#ff4f64;transform-origin:50% 75px;transform:translateX(-50%) rotate(0deg);border-radius:4px}
.center{position:absolute;left:50%;top:50%;width:14px;height:14px;border-radius:50%;background:#fff;transform:translate(-50%,-50%)}
.dir{position:absolute;font-weight:700;font-size:13px}
.n{top:7px;left:50%;transform:translateX(-50%)}.s{bottom:7px;left:50%;transform:translateX(-50%)}
.e{right:9px;top:50%;transform:translateY(-50%)}.w{left:9px;top:50%;transform:translateY(-50%)}
footer{color:#8092aa;font-size:12px;padding:18px 4px 36px;text-align:center;line-height:1.5}
.logo{font-size:34px;line-height:1}
</style>
</head>
<body>
<main>
<section class="hero">
  <div class="logo">🐐</div>
  <h1>Markhor Locator</h1>
  <p>Pakistan Cell-ID / LAC / TAC • MCC-MNC • Live GPS • BTS Dataset • Direction + Smart Beep</p>
  <span class="pill">HTTPS GPS</span>
  <span class="pill">Keyless Open Cell</span>
  <span class="pill">Jazz • Ufone • Telenor • Zong</span>
  <span class="pill">XLSX / CSV Import</span>
  <span class="pill">Hex ⇄ Dec</span>
</section>

<section class="card">
  <h2>📡 Serving Cell</h2>
  <div class="grid">
    <div><label>MCC</label><input id="mcc" inputmode="numeric" value="410" placeholder="410"></div>
    <div><label>MNC</label><input id="mnc" inputmode="numeric" value="01" placeholder="01 Jazz / 03 Ufone / 04 Zong / 06 Telenor / 07 Warid"></div>
    <div><label>LAC / TAC</label><input id="lac" inputmode="numeric" value="50406" placeholder="e.g. 10249 or 32491"></div>
    <div><label>Cell ID / ECI</label><input id="cid" inputmode="numeric" value="140605" placeholder="e.g. 35585 or Local Cell ID"></div>
    <div><label>Radio</label>
      <select id="radio">
        <option value="GSM">2G — GSM</option>
        <option value="UMTS">3G — UMTS</option>
        <option value="LTE" selected>4G — LTE</option>
        <option value="NR">5G — NR</option>
        <option value="ALL">ALL — Auto Detect</option>
      </select>
    </div>
    <div><label>Signal dBm (optional)</label><input id="ss" inputmode="numeric" placeholder="-85"></div>
    <div><label>IMEI (optional — model via TAC)</label><input id="imei" inputmode="numeric" placeholder="15-digit IMEI (first 14 digits used)"></div>
    <div><label>IMSI (optional)</label><input id="imsi" inputmode="numeric" placeholder="IMSI if available"></div>
  </div>
  <div class="row">
    <button class="blue" id="lookup">🧠 Analyze Cell / Location</button>
    <button class="gold" id="example">🧪 Example (Jazz)</button>
  </div>
  <div class="status" id="cellStatus">Enter MCC, MNC, LAC and Cell ID, then Analyze.</div>
</section>

<!-- rest of the HTML remains the same as previous version -->
</main>
<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
<script src="https://cdn.jsdelivr.net/npm/xlsx@0.18.5/dist/xlsx.full.min.js"></script>
<script>

</script>
</body>
</html>
